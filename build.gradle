plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    // Resout exactement net.neoforged:neoforge:21.1.215
    version = project.neo_version

    runs {
        client { client() }
        server { server(); programArguments.add('--nogui') }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    // Ice and Fire n'est PAS une dependance de compilation : l'integration passe par les entites
    // (type d'entite + variante interne lue par reflexion) pour rester compatible avec le portage non officiel.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}
